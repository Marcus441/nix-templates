name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The sandboxed build and its check phase — the same thing `nix build` does
  # locally, on both runner platforms.
  nix:
    name: nix build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ matrix.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-${{ matrix.os }}-
          gc-max-store-size: 4G
      - run: nix flake check --print-build-logs
      - run: nix build --print-build-logs .#clang

  # GCC is Linux-only here: nixpkgs' gccStdenv on aarch64-darwin is not
  # something this template promises.
  nix-gcc:
    name: nix build (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build --print-build-logs .#gcc

  # Everything the sandboxed build deliberately does not do: warnings as
  # errors, clang-tidy, and the sanitizers.
  checks:
    name: ${{ matrix.workflow }} (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shell: clang, workflow: ci }
          - { shell: clang, workflow: asan }
          - { shell: clang, workflow: tsan }
          - { shell: gcc, workflow: ci }
          - { shell: gcc, workflow: asan }
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-shell-${{ matrix.shell }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-shell-${{ matrix.shell }}-
          gc-max-store-size: 4G
      - run: nix develop .#${{ matrix.shell }} --command cmake --workflow --preset ${{ matrix.workflow }}

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Check formatting
        run: |
          nix develop .#clang --command bash -c \
            'clang-format --dry-run --Werror $(git ls-files "*.cpp" "*.hpp")'
