[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jetson-python-app"
version = "0.1.0"
description = "Python application for the NVIDIA Jetson platform"
requires-python = ">=3.13"
dependencies = [
  "numpy",
  "pyyaml",
]

[project.scripts]
jetson-python-app = "jetson_project.main:main"

[tool.setuptools.packages.find]
where = ["src"]
