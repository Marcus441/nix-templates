name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `devenv test` builds the environment, then runs enterTest — uv sync and the
  # test suite. It is not a build sandbox, so it has the network uv needs to
  # reach PyPI; that is also what makes this job slower than a flake
  # template's.
  devenv:
    name: devenv test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # devenv's own public cache. No secret, so this still works on fork PRs;
      # without it the runner builds devenv's closure from source.
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix profile install nixpkgs#devenv
      - run: devenv test

  # What `devenv test` does not cover: the lint and type policy in
  # pyproject.toml, and a sync that fails loudly when the committed uv.lock is
  # stale. Policy needs one platform, not two.
  checks:
    name: ruff, mypy and pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix profile install nixpkgs#devenv
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('uv.lock') }}
          restore-keys: uv-
      - run: devenv shell -- bash -c 'uv sync --locked'
      - run: devenv shell -- bash -c 'ruff check .'
      - run: devenv shell -- bash -c 'ruff format --check .'
      - run: devenv shell -- bash -c 'uv run --no-sync mypy'
      - run: devenv shell -- bash -c 'uv run --no-sync pytest'
