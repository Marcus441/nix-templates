[project]
name = "myproject"
version = "0.1.0"
description = "A small packaged Python CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
myproject = "myproject.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["mypy>=1.15", "pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.9"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["A", "ANN", "B", "C4", "E", "F", "I", "N", "PTH", "RUF", "S", "SIM", "UP", "W"]
ignore = ["ANN401", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
