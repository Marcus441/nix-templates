# Serves the built SPA and routes the API paths to the api container — the
# deployment counterpart of the vite dev proxy in apps/web/vite.config.ts.
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location ~ ^/(health|items|openapi) {
        proxy_pass http://api:5080;
    }
}
