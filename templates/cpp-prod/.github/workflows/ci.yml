name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `devenv test` builds the environment and runs the release workflow preset —
  # configure, the optimized/hardened/LTO build, ctest — on both runner
  # platforms. Not a build sandbox, but nothing here reaches the network:
  # GoogleTest comes from the environment, never from FetchContent.
  devenv:
    name: devenv test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # devenv's own public cache. No secret, so this still works on fork PRs;
      # without it the runner builds devenv's closure from source.
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix profile install nixpkgs#devenv
      - run: devenv test

  # Everything `devenv test` deliberately does not do: warnings as errors,
  # clang-tidy, and the sanitizers.
  checks:
    name: ${{ matrix.workflow }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workflow: [ci, asan, tsan]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix profile install nixpkgs#devenv
      - run: devenv shell -- cmake --workflow --preset ${{ matrix.workflow }}

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix profile install nixpkgs#devenv
      - name: Check formatting
        run: |
          devenv shell -- bash -c \
            'clang-format --dry-run --Werror $(git ls-files "*.cpp" "*.hpp")'
