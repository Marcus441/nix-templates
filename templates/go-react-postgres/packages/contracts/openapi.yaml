# The committed source of truth for the items API — edit this first, run
# scripts/generate-contracts.sh to rewrite src/api.d.ts from it, then make the
# Go handlers in apps/api agree. docs/architecture.md explains the flow.
openapi: 3.0.3
info:
  title: app
  version: 1.0.0
paths:
  /health:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /items:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
components:
  schemas:
    CreateItemRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
    HealthResponse:
      type: object
      required:
        - status
        - db
      properties:
        status:
          type: string
        db:
          type: integer
          format: int32
    Item:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
