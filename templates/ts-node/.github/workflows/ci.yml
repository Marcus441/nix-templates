name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The sandboxed build and its check phase — the same thing `nix build` does
  # locally, on both runner platforms. `doCheck = true`, so this runs the tests.
  nix:
    name: nix build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ matrix.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'package-lock.json') }}
          restore-prefixes-first-match: nix-${{ matrix.os }}-
          gc-max-store-size: 4G
      - run: nix flake check --print-build-logs
      - run: nix build --print-build-logs

  # What the sandboxed build does not do: typecheck the tests. tsconfig.json
  # covers src and test; tsconfig.build.json, which `npm run build` uses, does
  # not — so without this step a broken test file would only fail at runtime.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-shell-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-shell-
          gc-max-store-size: 4G
      - run: nix develop --command npm ci
      - run: nix develop --command npm run typecheck
