name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `devenv test` builds the environment, then runs enterTest — npm ci, the
  # vitest suite and the tsc build — on both runner platforms.
  devenv:
    name: devenv test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # devenv's own public cache. No secret, so this still works on fork PRs;
      # without it the runner builds devenv's closure from source.
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix profile install nixpkgs#devenv
      # `npm ci` downloads from the npm registry. devenv test is not a build
      # sandbox, so it has the network for that — which is also why this job is
      # slower than a flake template's.
      - run: devenv test

  # What enterTest does not do: typecheck the tests. tsconfig.json covers src
  # and test; tsconfig.build.json, which `npm run build` uses, does not — and
  # vitest runs test files without typechecking them, so a type error there
  # would not fail the suite.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix profile install nixpkgs#devenv
      - run: devenv shell -- npm ci
      - run: devenv shell -- npm run typecheck
